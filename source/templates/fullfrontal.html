<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<meta name="msapplication-TileColor" content="#da532c" />
		<meta name="theme-color" content="#ffffff" />
		<meta
			name="description"
			content="fullstack cloud solutions for creatives."
		/>
		<meta
			name="keywords"
			content="frontend web developer, web development, web design, user experience, digital solutions, stockholm, design system, importmap, system design"
		/>

		<meta
			property="og:title"
			content="fullfrontal: simple solutions for complex digital expressions"
		/>
		<meta
			property="og:description"
			content="fullstack cloud solutions for creatives."
		/>
		<meta property="og:url" content="https://www.fullfrontal.dev/" />
		<meta property="og:image" content="/fullfrontal.jpg" />

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/images/apple-touch-icon.png"
		/>

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/images/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/images/favicon-16x16.png"
		/>
		<link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
		<link rel="icon" type="image/png" href="/images/favicon.png" />

		<link
			rel="mask-icon"
			href="/images/safari-pinned-tab.svg"
			color="#5bbad5"
		/>
		<link rel="manifest" href="/site.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" />

		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@acab/reset.css@0.10.0/index.css"
		/>

		<link
			href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Lekton:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/fullfrontal.css" />
		<link
			rel="stylesheet"
			media="(min-width: 700px)"
			href="/css/fullfrontal-min-width-700px.css"
		/>
		<link
			rel="stylesheet"
			media="(min-width: 900px)"
			href="/css/fullfrontal-min-width-900px.css"
		/>

		<title>
			fullfrontal: simple solutions for complex digital expressions
		</title>
		<script type="application/ld+json" class="schemantra">
			{
				"@context": "https://schema.org",
				"@type": "CreativeWork",
				"@id": "CreativeWork",
				"abstract": "fullstack cloud solutions for creatives.",
				"accessMode": "[textual,visual]",
				"copyrightYear": "2024"
			}
		</script>

		<script type="importmap">
			{
				"imports": {
					"#dom": "./dom/fullfrontal.js"
				}
			}
		</script>

		<script type="module">
			import { main } from '#dom';

			globalThis.addEventListener('DOMContentLoaded', main);
		</script>
	</head>

	<body>
		<header>
			<fusionstrings-fullfrontal-logo>
				<h1><a href="/">fullfrontal</a></h1>
			</fusionstrings-fullfrontal-logo>
		</header>

		<main>
			<fusionstrings-fullfrontal-projects>
				<form
					action="/functions/fullfrontal/projects"
					method="post"
					id="create-fullfrontal-project"
					enctype="application/x-www-form-urlencoded"
				>
					<input type="text" name="name" id="name" />

					<input type="text" name="description" id="description" />
					<button id="create-project">Create Project</button>
				</form>
				<fusionstrings-fullfrontal-projects-list>
					<h2>Projects</h2>
					<ul></ul>
				</fusionstrings-fullfrontal-projects-list>
			</fusionstrings-fullfrontal-projects>
		</main>

		<footer>
			&copy; 2024
		</footer>
	</body>
</html>
